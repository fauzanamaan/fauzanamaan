<svg xmlns="http://www.w3.org/2000/svg" width="425" height="150" viewBox="0 0 425 150" role="img" aria-label="MenuIQ">
<style>
  text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .border { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.1s ease-out both; }
  .fade { animation: fade 0.5s ease-out both; }
  .pop { animation: pop 0.35s ease-out both; }
  .pulse { animation: pulse 1.8s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes pop { from { opacity: 0; transform: translateY(4px) scale(0.92); } to { opacity: 1; transform: none; } }
  @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.35; transform: scale(1.6); } }
  @media (prefers-reduced-motion: reduce) {
    .border, .fade, .pop, .pulse { animation: none; stroke-dashoffset: 0; }
  }
</style>
<rect width="425" height="150" rx="10" fill="#0d1117"/>
<rect class="border" x="1" y="1" width="423" height="148" rx="9" fill="none" stroke="#30363d" stroke-width="1.5" pathLength="1" style="animation-delay:0.0s"/>
<rect x="20" y="0" width="0" height="2" fill="#39d353"><animate attributeName="width" from="0" to="385" dur="0.8s" begin="0.2s" fill="freeze"/></rect>
<clipPath id="type-0"><rect x="20" y="14" width="0" height="26"><animate attributeName="width" values="0.0;9.1;18.2;27.3;36.4;45.5;54.6;63.7;72.8" calcMode="discrete" dur="0.36s" begin="0.5s" fill="freeze"/></rect></clipPath>
<text x="20" y="33" font-size="15" font-weight="700" fill="#39d353" clip-path="url(#type-0)">~/MenuIQ</text>
<rect x="20" y="20" width="8" height="15" fill="#39d353" opacity="0"><animate attributeName="x" values="20.0;29.1;38.2;47.3;56.4;65.5;74.6;83.7;92.8" calcMode="discrete" dur="0.36s" begin="0.5s" fill="freeze"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.01;0.99;1" dur="0.96s" begin="0.5s" fill="freeze"/></rect>
<g class="fade" style="animation-delay:0.7s"><circle class="pulse" cx="354.8" cy="29" r="3.5" fill="#39d353"/><text x="405" y="33" font-size="11" fill="#8b949e" text-anchor="end">active</text></g>
<text class="fade" x="20" y="58" font-size="12" fill="#c9d1d9" style="animation-delay:0.9s">Menu price intelligence for independent restaurants.</text>
<text class="fade" x="20" y="75" font-size="12" fill="#c9d1d9" style="animation-delay:1.02s">Senior capstone, I own the backend.</text>
<g class="pop" style="animation-delay:1.5s; transform-origin:368.0px 108px"><rect x="331" y="98" width="74" height="20" rx="10" fill="none" stroke="#8b949e" stroke-dasharray="3 2"/><rect x="341" y="107" width="8" height="6" rx="1" fill="#8b949e"/><path d="M342.5 107 v-2 a2.5 2.5 0 0 1 5 0 v2" fill="none" stroke="#8b949e" stroke-width="1.3"/><text x="354" y="112" font-size="11" fill="#8b949e">private</text></g>
<g class="pop" style="animation-delay:1.5s; transform-origin:48.1px 108px"><rect x="20" y="98" width="56.2" height="20" rx="10" fill="#21262d" stroke="#30363d"/><text x="48.1" y="112" font-size="11" fill="#8b949e" text-anchor="middle">Python</text></g>
<g class="pop" style="animation-delay:1.6s; transform-origin:115.65px 108px"><rect x="84.2" y="98" width="62.9" height="20" rx="10" fill="#21262d" stroke="#30363d"/><text x="115.7" y="112" font-size="11" fill="#8b949e" text-anchor="middle">FastAPI</text></g>
<g class="pop" style="animation-delay:1.7s; transform-origin:196.60000000000002px 108px"><rect x="155.10000000000002" y="98" width="83.0" height="20" rx="10" fill="#21262d" stroke="#30363d"/><text x="196.6" y="112" font-size="11" fill="#8b949e" text-anchor="middle">PostgreSQL</text></g>
<g class="pop" style="animation-delay:1.8s; transform-origin:280.90000000000003px 108px"><rect x="246.10000000000002" y="98" width="69.6" height="20" rx="10" fill="#21262d" stroke="#30363d"/><text x="280.9" y="112" font-size="11" fill="#8b949e" text-anchor="middle">pgvector</text></g>
</svg>