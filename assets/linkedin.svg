<svg xmlns="http://www.w3.org/2000/svg" width="860" height="48" viewBox="0 0 860 48" role="img" aria-label="LinkedIn profile">
<style>
  text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .label { font-size: 10px; fill: #8b949e; letter-spacing: 1.5px; }
  .value { font-size: 13px; fill: #c9d1d9; }
  .fade { animation: fade 0.5s ease-out both; }
  .pop { animation: pop 0.35s ease-out both; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes pop { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: none; } }
</style>
<rect width="860" height="48" rx="10" fill="#0d1117"/>
<rect x="1" y="1" width="858" height="46" rx="9" fill="none" stroke="#30363d" stroke-width="1.5"/>
<text class="label" x="28" y="28">LINKS</text>
<text class="value" x="108" y="29"><tspan fill="#58a6ff">LinkedIn</tspan>  /in/fauzanamaan</text>
<text class="value" x="816" y="29" fill="#58a6ff" style="fill:#58a6ff">-&gt;<animateTransform attributeName="transform" type="translate" values="0,0;6,0;0,0" dur="1.4s" repeatCount="indefinite"/></text>
</svg>